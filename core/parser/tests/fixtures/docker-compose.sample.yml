version: "3.8"
services:
  api:
    image: bob-simulator/api:latest
    ports:
      - "8080:8080"
    environment:
      - PAYMENT_API_TIMEOUT_MS=3000
      - PAYMENT_API_RETRIES=2
    depends_on:
      - redis
      - postgres
      - worker

  worker:
    image: bob-simulator/worker:latest
    environment:
      QUEUE_TIMEOUT_SECONDS: "10"
    depends_on:
      - rabbitmq

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:15

  rabbitmq:
    image: rabbitmq:3-management
